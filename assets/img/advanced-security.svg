<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Arrière-plan dégradé -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2540;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:0.4" />
    </radialGradient>
  </defs>
  
  <!-- Arrière-plan -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Bouclier de sécurité central avec effet de brillance -->
  <g transform="translate(150,100)">
    <circle cx="0" cy="0" r="60" fill="url(#shieldGlow)" />
    <path d="M0,-50 L20,-20 L50,-20 L25,5 L50,30 L0,50 L-50,30 L-25,5 L-50,-20 L-20,-20 Z" 
          fill="#00a8ff" stroke="#ffffff" stroke-width="2" />
    <path d="M0,-35 L15,-15 L35,-15 L20,0 L35,15 L0,35 L-35,15 L-20,0 L-35,-15 L-15,-15 Z" 
          fill="#0077ff" />
    
    <!-- Points de données chiffrées -->
    <circle cx="-15" cy="-25" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="20" cy="-30" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="10" cy="5" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="-25" cy="10" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="5" cy="25" r="3" fill="#ffffff" opacity="0.8" />
    
    <!-- Effet de verrouillage -->
    <rect x="-8" y="-5" width="16" height="12" rx="2" fill="#ffffff" />
    <circle cx="0" cy="-10" r="5" fill="#ffffff" />
  </g>
  
  <!-- Éléments de sécurité supplémentaires autour -->
  <circle cx="50" cy="40" r="8" fill="#00c6ff" opacity="0.6" />
  <circle cx="250" cy="160" r="6" fill="#00a8ff" opacity="0.5" />
  <circle cx="30" cy="170" r="4" fill="#0072ff" opacity="0.7" />
  <circle cx="270" cy="30" r="5" fill="#00c6ff" opacity="0.6" />
  
  <!-- Lignes de connexion de données -->
  <line x1="50" y1="40" x2="150" y2="100" stroke="#00a8ff" stroke-width="1" opacity="0.3" />
  <line x1="250" y1="160" x2="150" y2="100" stroke="#0072ff" stroke-width="1" opacity="0.3" />
</svg>